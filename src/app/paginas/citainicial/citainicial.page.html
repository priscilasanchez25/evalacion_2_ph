<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Citas</ion-title>
    <ion-buttons slot="end">
      <!-- Botón para ir a Configuraciones -->
      <ion-button fill="clear" [routerLink]="['/configuraciones']" routerDirection="root">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card class="card-estilo">
    <ion-card-header>
      <ion-card-title>{{ cita.frase }}</ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <p>{{ cita.autor }}</p>
    </ion-card-content>
  </ion-card>

 <ion-button *ngIf="habilitar" fill="clear" (click)="borrarCita(cita.id)">
  <ion-icon slot="start" name="trash-outline" size="large"></ion-icon>
  Opción habilitada para eliminar cita
</ion-button>

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Citas</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- FAB flotante -->
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button [routerLink]="['/gestioncitas']" routerDirection="root">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>


</ion-content>
